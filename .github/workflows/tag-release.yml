name: tag-release

# When version in tauri.conf.json is bumped on master, create v{version} tag
# if it does not exist yet. Pushing the tag triggers the release workflow.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  tag:
    if: github.repository == 'khoa-nguyen-bk18/obsclip'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: meta
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Create and push tag
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Obsclip ${{ steps.meta.outputs.version }}"
          git push origin "$TAG"
